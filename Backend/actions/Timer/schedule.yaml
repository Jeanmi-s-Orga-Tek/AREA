service: timer
name: "Timer - schedule"
description: "Triggers every day between two dates at a fixed time"
is_polling: true
parameters:
  time:
    type: "string"
    description: "Time in HH:mm format (24h)"
    required: true
    pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$"
    example: "14:30"
  timezone:
    type: "string"
    required: true
    default: "Europe/Paris"
    example: "Europe/Paris"
  start_date:
    type: "string"
    required: true
    pattern: "^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}$"
    example: "01/01/2024"
  end_date:
    type: "string"
    description: "End date in dd/mm/yyyy format"
    required: true
    pattern: "^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}$"
    example: "31/12/2024"
